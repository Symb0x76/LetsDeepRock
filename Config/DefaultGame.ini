; 可选:Host 直连 TURN 的内网地址(如 192.168.3.27:3478),省掉同局域网 Host
; 经公网绕路。当前路由器 hairpin 保留公网 IP+端口(2026-10-11 实测),留空也可用。
; 只对与 TURN 同局域网的机器有效:在本机 Saved/Config/Windows/Game.ini 覆盖,共享配置留空。
HostRelayServerAddress=""
; 留空时发布本机 LAN 地址。公网房主可填写公网 IP/DNS，并确保对应 UDP 端口已映射。
AdvertisedHostAddress=""
; 0 使用 IpNetDriver 实际监听端口；端口映射不一致时填写公网端口。
AdvertisedHostPort=0
LeaseHeartbeatIntervalSeconds=10.0
HostEndpointPollIntervalSeconds=1.0
HostEndpointWaitTimeoutSeconds=20.0
; 客户端候选试探:单个 direct 候选超时 + relay 候选超时(TURN 握手更慢)
CandidateProbeTimeoutSeconds=10.0
RelayProbeTimeoutSeconds=15.0
; travel 前并行 ping 全部候选(含经 TURN 的 relay),按 RTT 排序;全部应答即提前结束。0 关闭
CandidatePingWindowSeconds=2.0
; Host 全量发布:STUN 反射查询延迟到下一帧执行,避免阻塞 Lease 回调
